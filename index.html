<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afterglow</title>
  <meta name="description" content="An endless orchestral and choral score, composed live in your browser.">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" href="assets/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:title" content="Afterglow">
  <meta property="og:description" content="An endless orchestral and choral score, composed live in your browser.">
  <meta property="og:image" content="https://alexbrazier.github.io/afterglow/assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(16, 20, 32, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e9e6df;
      --muted: #8f93a3;
      --accent: #f2b45a;
      --accent-2: #7fb4ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    main {
      position: relative; z-index: 1;
      max-width: 880px; margin: 0 auto; padding: 48px 16px 64px;
      display: flex; flex-direction: column; gap: 20px;
    }
    header .brand { display: flex; align-items: center; gap: 16px; }
    header .brand img { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 4px 18px rgba(255, 120, 60, 0.25)); }
    header h1 { font: 500 52px/1 'Cormorant Garamond', serif; letter-spacing: 0.02em; margin: 0; }
    header p { margin: 6px 0 0; color: var(--muted); }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px; backdrop-filter: blur(10px);
    }
    .now { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
    .section-name { font: 500 40px/1.1 'Cormorant Garamond', serif; }
    .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
    .chords { text-align: right; }
    .chord { font: 600 34px/1 Inter, sans-serif; color: var(--accent); }
    .chord-next { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .meter { height: 4px; border-radius: 2px; background: var(--line); margin-top: 18px; overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 1.5s ease; }
    #timeline { width: 100%; height: 120px; display: block; cursor: pointer; touch-action: none; }
    #timeline:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
    .timeline-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; gap: 8px; }
    .journey-nav { display: flex; align-items: center; gap: 6px; }
    .journey-nav button { padding: 2px 10px; font-size: 13px; }
    .transport { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      font: 500 14px Inter, sans-serif; color: var(--text); background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
    button:disabled { opacity: 0.4; cursor: default; }
    button[aria-pressed="true"] { background: rgba(242, 180, 90, 0.18); border-color: rgba(242, 180, 90, 0.5); }
    #play { background: var(--accent); color: #1b1305; border: none; font-weight: 600; min-width: 120px; }
    #play:hover { background: #ffc677; }
    #rec.on { background: #c0392b; border-color: #c0392b; }
    .status { color: var(--muted); font-size: 13px; margin-left: auto; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 28px; }
    label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 12px; }
    label span { display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    h2 { font: 600 11px Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
    .panel-head button { padding: 4px 12px; font-size: 12px; }

    /* instruments view */
    .lane {
      display: grid; grid-template-columns: 150px 1fr 96px auto; gap: 12px; align-items: center;
      padding: 4px 0; border-top: 1px solid var(--line);
    }
    .lane:first-of-type { border-top: none; }
    .lane-name { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
    .lane-name i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .lane canvas { width: 100%; height: 34px; display: block; }
    .lane-notes { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lane-btns { display: flex; gap: 4px; }
    .lane-btns button { padding: 2px 0; width: 28px; font-size: 11px; font-weight: 600; }
    .lane-btns .m[aria-pressed="true"] { background: rgba(255, 110, 90, 0.25); border-color: rgba(255, 110, 90, 0.6); }
    .lane.silent .lane-name, .lane.silent .lane-notes { opacity: 0.4; }

    footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
    footer button { padding: 2px 10px; font-size: 12px; }
    kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

    #loading { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(5, 7, 13, 0.85); }
    #loading.show { display: grid; }
    #loading .box { width: min(360px, 90vw); text-align: center; }
    #loading .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 14px; overflow: hidden; }
    #loading .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
    @media (max-width: 560px) {
      header h1 { font-size: 40px; }
      header .brand img { width: 44px; height: 44px; }
      .now { grid-template-columns: 1fr; }
      .chords { text-align: left; }
      .status { margin-left: 0; width: 100%; }
      .lane { grid-template-columns: 1fr auto; gap: 4px 10px; }
      .lane canvas { grid-column: 1 / -1; grid-row: 2; }
      .lane-notes { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <main>
    <header>
      <div class="brand"><img src="assets/icon-192.png" alt=""><h1>Afterglow</h1></div>
      <p>An endless orchestral &amp; choral score, composed live in your browser.</p>
    </header>

    <section class="panel">
      <div class="now">
        <div>
          <div class="section-name" id="section">Press play</div>
          <div class="meta">
            <span id="key">A minor</span><span id="tempo">— bpm</span><span id="barpos"></span><span id="elapsed"></span>
          </div>
        </div>
        <div class="chords">
          <div class="chord" id="chord">—</div>
          <div class="chord-next" id="next"></div>
        </div>
      </div>
      <div class="meter" title="Intensity"><div id="intensity"></div></div>
    </section>

    <section class="panel">
      <div class="timeline-head">
        <div class="journey-nav">
          <button id="prevJourney" title="Previous journey" aria-label="Previous journey" disabled>‹</button>
          <span id="journey">Journey</span>
          <button id="nextJourney" title="Next journey" aria-label="Next journey" disabled>›</button>
        </div>
        <span>click or drag to jump</span>
      </div>
      <canvas id="timeline" tabindex="0" aria-label="Journey timeline. Click or drag to jump; left and right arrows move between sections."></canvas>
    </section>

    <section class="panel transport">
      <button id="play">Play</button>
      <button id="prevSec" title="Previous section (←)" disabled>⏮</button>
      <button id="nextSec" title="Next section (→)" disabled>⏭</button>
      <button id="rec" disabled>Record</button>
      <button id="showInst" aria-pressed="false" title="Show instruments (I)">Instruments</button>
      <span class="status" id="status" role="status">Samples load on first play (~4 MB).</span>
    </section>

    <section class="panel" id="instruments" hidden>
      <div class="panel-head">
        <h2>Instruments</h2>
        <button id="clearMutes" title="Clear all mutes and solos">Reset M / S</button>
      </div>
      <div id="lanes"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Shape</h2></div>
      <div class="controls">
        <label><span>Energy <b id="energyv">0</b></span><input id="energy" type="range" min="-0.3" max="0.3" step="0.01" value="0"></label>
        <label><span>Tempo nudge <b id="tempov">0</b></span><input id="tempoNudge" type="range" min="-10" max="10" step="1" value="0"></label>
        <label><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.85"></label>
        <label><span>Reverb</span><input id="reverb" type="range" min="0" max="1.6" step="0.01" value="0.9"></label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Mix</h2></div>
      <div class="controls">
        <label><span>Strings</span><input data-mix="strings" type="range" min="0" max="1.5" step="0.01" value="1"></label>
        <label><span>Choir</span><input data-mix="choir" type="range" min="0" max="1.5" step="0.01" value="1"></label>
        <label><span>Brass</span><input data-mix="brass" type="range" min="0" max="1.5" step="0.01" value="1"></label>
        <label><span>Harp, celesta &amp; pizzicato</span><input data-mix="texture" type="range" min="0" max="1.5" step="0.01" value="1"></label>
        <label><span>Timpani</span><input data-mix="perc" type="range" min="0" max="1.5" step="0.01" value="1"></label>
      </div>
    </section>

    <footer>
      <span><kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> sections · <kbd>I</kbd> instruments</span>
      <span>Seed <b id="seed"></b> <button id="copySeed" title="Copy a link that starts this same performance">Copy link</button></span>
    </footer>
  </main>

  <div id="loading"><div class="box">Loading orchestra… <span id="loadpct">0%</span><div class="bar"><div id="loadbar"></div></div></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
